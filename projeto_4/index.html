<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
</head>
<body>
    <form>
        <main class="container d-flex justify-content-center aling-center min-vh-100">
            <!-- card -->
            <div class="card shadow-sm p-4 w-100" style="max-width: 500px;">
                <h2 class="text-center mb-4 text-primary fw-bold"> criar conta</h2>
                <form class="needs-validation" novalidate>
                    <!-- grid -->
                    <div class="row g-3 md-3">
                        <div class="col-md-6">
                            <label for="validationNome" class="form-label"> Nome</label>
                            <input type="text" class="form-control" id="validationNome">
                            <div class="invalid-feedback">Por favor, insira seu nome</div>
                        </div>
                        <div class="col-md-6">
                            <label for="validationNome" class="form-label"> Sobrenome</label>
                            <input type="text" class="form-control" id="validationNome">
                            <div class="invalid-feedback">Por favor, insira seu sobrenomenome</div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="validationEmail" class="form-label">Endereço de E-mail</label>
                        <div class="input-group">
                            <span class="input-group-text" id="addon-wrapping">@</span>
                            <input type="email" class="form-control" id="validationEmail" placeholder="nome@exemplo.com"
                                required>
                            <DIV class="invalid-feedback">Por favor, insira um e-mail valido</DIV>
                        </div>
                    </div>
                </form>

                <button type="button" class="btn btn-success">Enviar</button>
                <button type="button" class="btn btn-danger">Cancelar</button>
        </main>
    </form>
</body>

</html>
