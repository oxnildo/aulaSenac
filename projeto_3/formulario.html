<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
</head>

<body>
    <form action="">
        <h1>Formulario</h1>
        <br>

        <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Email</label>
            <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
        </div>
        <br>

        <div class="row g-3 align-items-center">
            <div class="col-auto">
                <label for="inputPassword6" class="col-form-label">Senha</label>
            </div>
            <div class="col-auto">
                <input type="password" id="inputPassword6" class="form-control" aria-describedby="passwordHelpInline">
            </div>
            <div class="col-auto">
                <span id="passwordHelpInline" class="form-text">
                    Tem que ter entre 8 a 20 caracteres, sua capivara sem dente.
                </span>
            </div>
        </div>
        <br>

        <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">Examplo de texto</label>
            <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="checkDefault">
            <label class="form-check-label" for="checkDefault">
                ta gostrando da aula?
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="checkChecked" checked>
            <label class="form-check-label" for="checkChecked">
                ja pode ir pra casa?
            </label>
        </div>
        <button type="button" class="btn btn-success">Enviar</button>
        <button type="button" class="btn btn-danger">Cancelar</button>
    </form>

    <div class="container d-flex justify-content-center aling-center min-vh-100">
        <!-- card -->
        <div class="card shadow-sm p-4 w-100" style="max-width: 500px;">
            <h2 class="text-center mb-4 text-primary fw-bold"> criar conta</h2>
            <form class="needs-validation" novalidate>
                <!-- grid -->
                <div class="row g-3 md-3">
                    <div class="col-md-6">
                        <label for="validationNome" class="form-label"> Nome</label>
                        <input type="text" class="form-control" id="validationNome">
                        <div class="invalid-feedback">Por favor, insira seu nome</div>
                    </div>
                    <div class="col-md-6">
                        <label for="validationNome" class="form-label"> Sobrenome</label>
                        <input type="text" class="form-control" id="validationNome">
                        <div class="invalid-feedback">Por favor, insira seu sobrenomenome</div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="validationEmail" class="form-label">Endereço de E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text" id="addon-wrapping">@</span>
                        <input type="email" class="form-control" id="validationEmail" placeholder="nome@exemplo.com" required>
                        <DIV class="invalid-feedback">Por favor, insira um e-mail valido</DIV>
                    </div>
                </div>
                
                <button type="button" class="btn btn-success">Enviar</button>
                <button type="button" class="btn btn-danger">Cancelar</button>
            </form>
        </div>
    </div>
</body>

</html>
