<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato Minha Página</title>
</head>
<body>
    <header>
        <div class="container">
            <h1> Minha página de contato</h1>

            <nav aria-label="Navegação principal">
                <a href="index.html"> Início </a>
                <a href="sobre.html"> Sobre </a>
                <a class="ativo" href="contato.html"> Contato </a>
            </nav>
        </div>

    </header>

    <main class="container">
        <section >
            <h2>Entre em contato</h2>

            <form id="form-contato" class="formulario">

                <row>
                    <div>
                        <label for="nome-contato"> Nome: </label>
                        <input type="text" id="nome-contato" 
                        name="nome"
                        required
                        >
                    </div>

                    <div>
                        <label for="email"> E-mail: </label>
                        <input 
                        type="email" 
                        name='email'
                        required
                        >
                    </div>

                </row>

                <row>
                    <div>
                        <label for="assunto"> Assunto: </label>
                        <input 
                            type="text"
                            id="assunto"
                            name="assunto"
                            required
                        >
                        
                    </div>

                    <div>
                        <label for="texto-mensagem"> Mensagem: </label>
                        <textarea
                            id="texto-mensagem"
                            name="mensagem"
                            rows="6"
                            required>
                        </textarea>
                    </div>

                    
                </row>

            </form>
        </section>
    </main>
</body>
</html>
